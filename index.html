<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#135D3A" />
  <title>Zayko — Portals</title>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #FAF8F2; color: #191C1A; display: flex; justify-content: center; padding: 32px 16px; }
    .wrap { width: 100%; max-width: 440px; }
    .logo { width: 56px; height: 56px; border-radius: 16px; background: #135D3A; color: #FAF8F2; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 800; margin-bottom: 14px; }
    h1 { font-size: 22px; margin: 0 0 6px; }
    p { font-size: 14px; color: #5B635E; margin: 0 0 22px; }
    .card { display: block; text-decoration: none; color: inherit; background: #FFFFFF; border: 1px solid #E1DDD2; border-radius: 16px; padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(19,93,58,0.08); }
    .card strong { display: block; font-size: 16px; color: #135D3A; margin-bottom: 4px; }
    .card span { font-size: 13px; color: #5B635E; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">Z</div>
    <h1>Zayko Platform</h1>
    <p>Good food, good mood.</p>
    <a class="card" href="./admin/"><strong>Zayko Admin Web Portal</strong><span>Live operations console for store approvals, orders &amp; support</span></a>
    <a class="card" href="./www-customer/"><strong>Zayko Customer Web Preview</strong><span>Mobile web preview (APK built via GitHub Actions)</span></a>
    <a class="card" href="./www-partner/"><strong>Zayko Partner Web Preview</strong><span>Restaurant web preview (APK built via GitHub Actions)</span></a>
  </div>
</body>
</html>
