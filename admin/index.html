<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Zayko Admin — Android Management Console</title>
  <style>
    /* =========================================================================
       1. MATERIAL DESIGN 3 (ANDROID) TOKENS — ZAYKO ADMIN
       ========================================================================= */
    :root {
      --md-primary: #135D3A;
      --md-on-primary: #FFFFFF;
      --md-primary-container: #D4EDDF;
      --md-on-primary-container: #072B19;
      --md-secondary: #EA6A2B;
      --md-bg: #FAF8F2;
      --md-surface: #FFFFFF;
      --md-surface-container-low: #F5F2EA;
      --md-surface-container: #EFECE2;
      --md-surface-container-high: #E7E3D7;
      --md-outline: #737974;
      --md-outline-variant: #E1DDD2;
      --md-ink: #191C1A;
      --md-muted: #5B635E;
      --md-error: #BA1A1A;
      --md-error-container: #FFDAD6;
      --md-on-error-container: #410002;
      --md-amber: #9A5B00;
      --md-amber-container: #FFEDD5;

      --md-shape-xs: 8px;
      --md-shape-sm: 12px;
      --md-shape-md: 16px;
      --md-shape-lg: 24px;
      --md-shape-full: 9999px;

      --md-elev-1: 0 1px 3px rgba(19, 93, 58, 0.08), 0 1px 2px rgba(25, 28, 26, 0.06);
      --md-elev-2: 0 3px 8px rgba(19, 93, 58, 0.12), 0 1px 3px rgba(25, 28, 26, 0.08);
      --md-elev-3: 0 8px 24px rgba(25, 28, 26, 0.18);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      min-height: 100%;
      background-color: #E8E4DA;
      color: var(--md-ink);
      font-family: "Roboto", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    button, input, textarea, select {
      font-family: inherit;
      font-size: inherit;
      color: inherit;
    }

    button { border: none; background: none; cursor: pointer; }
    button:disabled { opacity: 0.42; cursor: not-allowed; }
    a { color: inherit; text-decoration: none; }
    .hidden { display: none !important; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    @keyframes m3FadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-m3 { animation: m3FadeUp 0.18s cubic-bezier(0.2, 0, 0, 1); }

    /* =========================================================================
       2. ANDROID DEVICE SHELL & PERSISTENT STATUS BAR
       ========================================================================= */
    .android-shell {
      width: 100%;
      max-width: 428px;
      margin: 0 auto;
      min-height: 100vh;
      background: var(--md-bg);
      position: relative;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.12);
    }

    .android-shell.with-nav { padding-bottom: 92px; }

    .android-status-bar {
      position: sticky;
      top: 0;
      z-index: 40;
      height: 28px;
      padding: 0 16px;
      background: rgba(250, 248, 242, 0.98);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 700;
      color: var(--md-ink);
      user-select: none;
      flex-shrink: 0;
      border-bottom: 1px solid rgba(225, 221, 210, 0.45);
    }

    .status-icons { display: flex; align-items: center; gap: 6px; }

    .z-app-icon {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      background: var(--md-primary);
      color: var(--md-on-primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 800;
      box-shadow: var(--md-elev-1);
      user-select: none;
      flex-shrink: 0;
    }

    .z-app-icon-lg {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      font-size: 34px;
      box-shadow: var(--md-elev-2);
    }

    /* =========================================================================
       3. MATERIAL 3 TOP BAR, CARDS, CHIPS, INPUTS & BUTTONS
       ========================================================================= */
    .m3-top-bar {
      position: sticky;
      top: 0;
      padding-top: calc(10px + env(safe-area-inset-top, 0px));
      z-index: 20;
      background: rgba(250, 248, 242, 0.96);
      backdrop-filter: blur(10px);
      padding: 10px 16px;
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px solid var(--md-outline-variant);
    }

    .page-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .m3-card {
      background: var(--md-surface);
      border: 1px solid var(--md-outline-variant);
      border-radius: var(--md-shape-md);
      padding: 14px;
      box-shadow: var(--md-elev-1);
    }

    .m3-card-tonal {
      background: var(--md-surface-container-low);
      border: 1px solid var(--md-outline-variant);
      border-radius: var(--md-shape-md);
      padding: 13px;
    }

    .m3-card-pressable {
      cursor: pointer;
      transition: transform 0.12s ease;
    }
    .m3-card-pressable:active { transform: scale(0.985); }

    .m3-banner-primary {
      background: var(--md-primary-container);
      color: var(--md-on-primary-container);
      border-radius: var(--md-shape-md);
      padding: 13px;
    }

    .m3-banner-error {
      background: var(--md-error-container);
      color: var(--md-on-error-container);
      border-radius: var(--md-shape-md);
      padding: 13px;
    }

    .m3-banner-amber {
      background: var(--md-amber-container);
      color: var(--md-amber);
      border-radius: var(--md-shape-sm);
      padding: 11px 13px;
    }

    .m3-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 46px;
      padding: 0 16px;
      border-radius: var(--md-shape-full);
      font-size: 13px;
      font-weight: 700;
      transition: transform 0.1s ease;
      text-align: center;
    }
    .m3-btn:active:not(:disabled) { transform: scale(0.975); }
    .m3-btn-sm { min-height: 36px; padding: 0 12px; font-size: 12px; }
    .m3-btn-block { width: 100%; }
    .m3-btn-filled { background: var(--md-primary); color: #FFFFFF; box-shadow: var(--md-elev-1); }
    .m3-btn-tonal { background: var(--md-primary-container); color: var(--md-on-primary-container); }
    .m3-btn-outlined { background: var(--md-surface); color: var(--md-ink); border: 1px solid var(--md-outline); }
    .m3-btn-danger { background: var(--md-error); color: #FFFFFF; }
    .m3-btn-danger-outline { background: var(--md-surface); color: var(--md-error); border: 1px solid var(--md-error); }

    .m3-icon-btn {
      width: 40px;
      height: 40px;
      border-radius: var(--md-shape-full);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--md-ink);
      flex-shrink: 0;
    }

    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .chip-rail {
      display: flex;
      align-items: center;
      gap: 7px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .m3-chip {
      height: 34px;
      padding: 0 12px;
      border-radius: var(--md-shape-xs);
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      border: 1px solid var(--md-outline-variant);
      background: var(--md-surface);
      color: var(--md-ink);
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .m3-chip.selected {
      background: var(--md-primary-container);
      color: var(--md-on-primary-container);
      border-color: transparent;
      font-weight: 700;
    }

    .m3-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2.5px 8px;
      border-radius: var(--md-shape-xs);
      font-size: 10.5px;
      font-weight: 700;
      white-space: nowrap;
    }
    .m3-badge-primary { background: var(--md-primary-container); color: var(--md-on-primary-container); }
    .m3-badge-amber { background: var(--md-amber-container); color: var(--md-amber); }
    .m3-badge-error { background: var(--md-error-container); color: var(--md-on-error-container); }
    .m3-badge-neutral { background: var(--md-surface-container); color: var(--md-muted); }

    .m3-search-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--md-surface);
      border: 1px solid var(--md-outline-variant);
      border-radius: var(--md-shape-full);
      padding: 4px 14px;
      min-height: 44px;
    }
    .m3-search-bar input { flex: 1; border: none; outline: none; background: transparent; font-size: 13px; min-width: 0; }

    .form-group { margin-bottom: 12px; }
    .form-label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 5px; }
    .m3-input {
      width: 100%;
      background: var(--md-surface);
      border: 1.5px solid var(--md-outline-variant);
      border-radius: var(--md-shape-sm);
      padding: 11px 13px;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--md-ink);
    }
    .m3-input:focus { outline: none; border-color: var(--md-primary); }

    .check-row {
      width: 100%;
      padding: 11px 12px;
      border-radius: 12px;
      border: 1px solid var(--md-outline-variant);
      background: var(--md-surface);
      display: flex;
      align-items: flex-start;
      gap: 10px;
      text-align: left;
      margin-bottom: 8px;
    }
    .check-row.checked { background: var(--md-primary-container); border-color: var(--md-primary); }
    .check-box {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      border: 2px solid var(--md-outline);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 800;
      color: #FFFFFF;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .check-row.checked .check-box { background: var(--md-primary); border-color: var(--md-primary); }

    /* =========================================================================
       4. MATERIAL 3 NAVIGATION BAR (5 TABS WITH PILL INDICATOR)
       ========================================================================= */
    .m3-nav-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 428px;
      background: var(--md-surface-container-low);
      border-top: 1px solid var(--md-outline-variant);
      padding: 8px 4px calc(8px + env(safe-area-inset-bottom, 0px));
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 2px;
      z-index: 30;
    }

    .m3-nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      font-size: 10.5px;
      font-weight: 600;
      color: var(--md-muted);
      position: relative;
    }

    .m3-nav-pill {
      width: 52px;
      height: 28px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.16s ease, color 0.16s ease;
    }

    .m3-nav-item.active { color: var(--md-ink); font-weight: 700; }
    .m3-nav-item.active .m3-nav-pill { background: var(--md-primary-container); color: var(--md-on-primary-container); }

    .m3-nav-badge {
      position: absolute;
      top: -1px;
      right: calc(50% - 22px);
      min-width: 16px;
      height: 16px;
      padding: 0 4px;
      border-radius: 999px;
      background: var(--md-secondary);
      color: #FFFFFF;
      font-size: 9.5px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    /* =========================================================================
       5. ANDROID BOTTOM SHEETS & SNACKBAR
       ========================================================================= */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(25, 28, 26, 0.48);
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .bottom-sheet {
      width: 100%;
      max-width: 428px;
      background: var(--md-surface-container-low);
      border-radius: 28px 28px 0 0;
      padding: 10px 18px 24px;
      max-height: 88vh;
      overflow-y: auto;
      box-shadow: var(--md-elev-3);
      display: flex;
      flex-direction: column;
      gap: 12px;
      animation: m3FadeUp 0.18s cubic-bezier(0.2, 0, 0, 1);
    }

    .sheet-drag-handle {
      width: 36px;
      height: 4px;
      border-radius: 2px;
      background: var(--md-outline);
      opacity: 0.4;
      margin: 2px auto 4px;
      flex-shrink: 0;
    }

    .android-snackbar {
      position: fixed;
      bottom: 86px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 396px;
      z-index: 80;
      background: #2E322F;
      color: #F4F5F4;
      font-size: 13px;
      font-weight: 500;
      padding: 13px 16px;
      border-radius: 10px;
      box-shadow: var(--md-elev-3);
      animation: m3FadeUp 0.15s ease-out;
    }

    .text-xs { font-size: 12px; }
    .text-xxs { font-size: 10.5px; }
    .text-sm { font-size: 13.5px; }
    .text-base { font-size: 16px; }
    .font-bold { font-weight: 700; }
    .text-muted { color: var(--md-muted); }
    .text-primary { color: var(--md-primary); }
    .text-error { color: var(--md-error); }
    .truncate { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  </style>
</head>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import {
      getAuth,
      signInAnonymously,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    import {
      getFirestore,
      collection,
      doc,
      setDoc,
      deleteDoc,
      getDocs,
      onSnapshot
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC3tPo7KLznK4imXXcZeof2mutH84jgpLY",
      authDomain: "zayko-food-delivery-854ec.firebaseapp.com",
      projectId: "zayko-food-delivery-854ec",
      storageBucket: "zayko-food-delivery-854ec.firebasestorage.app",
      messagingSenderId: "72605066232",
      appId: "1:72605066232:web:f01f4f55cb9f4ba2a7ac0d",
      measurementId: "G-VB5GJ2B4TZ"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.ZaykoDB = {
      auth,
      db,
      async signInAnon() {
        if (auth.currentUser) return auth.currentUser;
        const cred = await signInAnonymously(auth);
        return cred.user;
      },
      async signInAdmin(email, password) {
        const cred = await signInWithEmailAndPassword(auth, email, password);
        return cred.user;
      },
      async signOutUser() {
        await signOut(auth);
      },
      onAuth(cb) {
        return onAuthStateChanged(auth, cb);
      },
      listenCollection(colName, cb) {
        return onSnapshot(
          collection(db, colName),
          (snap) => {
            const list = [];
            snap.forEach((d) => list.push({ ...d.data(), _docId: d.id }));
            cb(list);
          },
          (err) => console.warn("Firestore listen error (" + colName + "):", err)
        );
      },
      listenDoc(colName, docId, cb) {
        return onSnapshot(
          doc(db, colName, docId),
          (snap) => {
            if (snap.exists()) cb(snap.data());
          },
          (err) => console.warn("Firestore doc listen error (" + colName + "/" + docId + "):", err)
        );
      },
      async setDoc(colName, docId, data) {
        await setDoc(doc(db, colName, String(docId)), data, { merge: true });
      },
      async deleteDoc(colName, docId) {
        await deleteDoc(doc(db, colName, String(docId)));
      },
      async seedIfEmpty(colName, docsMap) {
        try {
          const snap = await getDocs(collection(db, colName));
          if (snap.empty) {
            const entries = Object.entries(docsMap);
            for (const [id, data] of entries) {
              await setDoc(doc(db, colName, String(id)), data, { merge: true });
            }
          }
        } catch (err) {
          console.warn("Seed skipped (" + colName + "):", err);
        }
      },
      compressImage(dataUrl, maxWidth = 720, quality = 0.65) {
        return new Promise((resolve) => {
          if (!dataUrl || !String(dataUrl).startsWith("data:image")) {
            resolve(dataUrl || "");
            return;
          }
          const img = new Image();
          img.onload = () => {
            let w = img.width;
            let h = img.height;
            if (w > maxWidth) {
              h = Math.round((h * maxWidth) / w);
              w = maxWidth;
            }
            const canvas = document.createElement("canvas");
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL("image/jpeg", quality));
          };
          img.onerror = () => resolve(dataUrl);
          img.src = dataUrl;
        });
      }
    };
    window.dispatchEvent(new Event("zayko-db-ready"));
  </script>

      var STORAGE_KEY = 'zayko_admin_android_v1';
      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            isAuthenticated: state.isAuthenticated,
            settings: state.settings,
            restaurants: state.restaurants,
            changeRequests: state.changeRequests,
            orders: state.orders,
            tickets: state.tickets,
            activities: state.activities
          }));
        } catch (err) {}
      }
      function loadState() {
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return;
          var p = JSON.parse(raw);
          if (p && typeof p === 'object') {
            if (typeof p.isAuthenticated === 'boolean') state.isAuthenticated = p.isAuthenticated;
            if (p.settings) state.settings = p.settings;
            if (Array.isArray(p.restaurants)) state.restaurants = p.restaurants;
            if (Array.isArray(p.changeRequests)) state.changeRequests = p.changeRequests;
            if (Array.isArray(p.orders)) state.orders = p.orders;
            if (Array.isArray(p.tickets)) state.tickets = p.tickets;
            if (Array.isArray(p.activities)) state.activities = p.activities;
          }
        } catch (err) {}
      }
      loadState();
      var SHARED_REQ_KEY = 'zayko_shared_requests_v1';
      function syncSharedRequests() {
        try {
          var raw = localStorage.getItem(SHARED_REQ_KEY);
          if (!raw) return;
          var list = JSON.parse(raw);
          if (!Array.isArray(list)) return;
          list.forEach(function (sr) {
            if (!state.changeRequests.some(function (x) { return x.id === sr.id; })) {
              state.changeRequests.unshift(sr);
            }
          });
        } catch (err) {}
      }
      function writeSharedRequests() {
        try {
          localStorage.setItem(SHARED_REQ_KEY, JSON.stringify(state.changeRequests));
        } catch (err) {}
      }
      syncSharedRequests();

      function esc(v) {
        return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }
      function inr(amt) { return '₹' + Number(amt || 0).toLocaleString('en-IN'); }
      function telHref(phone) { return 'tel:' + String(phone || '').replace(/[^+\d]/g, ''); }
      function showToast(msg) {
        toastMsgEl.textContent = msg;
        toastEl.classList.remove('hidden');

      function openModal(html) {

      function renderOrdersTab() {

          var mf = state.orderFilter === 'all' || (state.orderFilter === 'live' ? isLiveOrderStatus(o.status) : o.status === state.orderFilter);

        });

        return (
          '<div class="chip-rail no-scrollbar">' + filters.map(function (f) {
            var sel = state.orderFilter === f.k;
            return '<button type="button" class="m3-chip ' + (sel ? 'selected' : '') + '" data-action="set-order-filter" data-filter="' + f.k + '">' + (sel ? '✓ ' : '') + f.l + '</button>';

          '<div class="m3-search-bar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--md-muted)" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input id="order-search-input" type="search" value="' + esc(state.orderSearch) + '" placeholder="Search order #, customer, restaurant..." /></div>' +

      function renderSupportTab() {
        var filtered = state.tickets.filter(function (t) {

          '</div>' +
          '<div class="chip-rail no-scrollbar">' +

      function renderSettingsTab() {
        var st = state.settings;
        return (
          '<form id="global-settings-form" class="m3-card" novalidate>' +
          '<h2 class="text-base font-bold">Guwahati Delivery &amp; Support</h2>' +

      function renderMainShell() {
        var titles = { overview: 'Overview', restaurants: 'Restaurants', orders: 'Master Orders', support: 'Support Desk', settings: 'Global Settings' };
        var bodyHtml = state.activeTab === 'restaurants' ? renderStoresTab() : state.activeTab === 'orders' ? renderOrdersTab() : state.activeTab === 'support' ? renderSupportTab() : state.activeTab === 'settings' ? renderSettingsTab() : renderOverviewTab();
        var pendingTotal = getPendingRestaurantsCount() + getPendingRequestsCount();
        var openTickets = getOpenTicketsCount();

        var navItems = [
          { k: 'overview', l: 'Overview', i: ICONS.overview, b: 0 },
          { k: 'restaurants', l: 'Stores', i: ICONS.stores, b: pendingTotal },
          { k: 'orders', l: 'Orders', i: ICONS.orders, b: 0 },

        return (

          '<div style="min-width:0;"><h1 class="text-base font-bold truncate">' + (titles[state.activeTab] || 'Overview') + '</h1><p class="text-xxs text-muted">Zayko Admin · Guwahati</p></div>' +
          '</div>' +
          '<div style="display:flex; align-items:center; gap:4px;"><button type="button" data-action="open-notifications" aria-label="Notifications" class="m3-icon-btn" style="position:relative;"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg><span id="notif-dot" style="position:absolute; top:9px; right:9px; width:7px; height:7px; border-radius:50%; background:var(--md-secondary);"></span></button><button type="button" data-action="logout" class="m3-btn m3-btn-outlined m3-btn-sm">Logout</button></div>' +

          navItems.map(function (it) {

            return (
              '<button type="button" class="m3-nav-item ' + (active ? 'active' : '') + '" data-action="switch-tab" data-tab="' + it.k + '">' +

              '</button>'
            );
          }).join('') +
          '</nav>'
        );

      // =======================================================================
      // BOTTOM SHEETS
      // =======================================================================
      function openVerifySheet(restId) {
        var r = state.restaurants.find(function (x) { return x.id === restId; });
        if (!r) return;
        var items = [
          { k: 'details', t: 'Confirmed name, Guwahati address & cuisine', s: r.name + ' · ' + r.address },
          { k: 'phone', t: 'Confirmed owner phone & hours', s: r.ownerName + ' (' + r.phone + ')' },
          { k: 'upi', t: 'Verified Restaurant UPI ID', s: r.upiId },
          { k: 'delivery', t: 'Confirmed own delivery staff', s: 'Partner uses own delivery staff' }
        ];
        var doneCount = items.filter(function (i) { return !!state.verifyChecks[i.k]; }).length;
        var allOk = doneCount === 4;

        openModal(
          '<div style="display:flex; justify-content:space-between; align-items:center;"><div><h2 class="text-base font-bold">Verify ' + esc(r.name) + '</h2><p class="text-xxs text-muted">' + doneCount + '/4 checks completed</p></div><button type="button" class="m3-icon-btn" data-action="close-modal">✕</button></div>' +
          '<div>' +
          items.map(function (i) {
            var chk = !!state.verifyChecks[i.k];
            return '<button type="button" class="check-row ' + (chk ? 'checked' : '') + '" data-action="toggle-verify" data-rest-id="' + esc(r.id) + '" data-key="' + i.k + '"><span class="check-box">' + (chk ? '✓' : '') + '</span><span><strong class="text-xs" style="display:block;">' + esc(i.t) + '</strong><span class="text-xxs text-muted">' + esc(i.s) + '</span></span></button>';
          }).join('') +
          '</div>' +
          '<div class="btn-row"><button type="button" class="m3-btn m3-btn-outlined" data-action="close-modal">Cancel</button><button type="button" class="m3-btn m3-btn-filled" data-action="confirm-approve-rest" data-rest-id="' + esc(r.id) + '"' + (allOk ? '' : ' disabled') + '>Approve &amp; Go Live</button></div>'
        );
      }

      function openRejectSheet(restId) {
        var r = state.restaurants.find(function (x) { return x.id === restId; });
        if (!r) return;
        var reasons = ['Invalid UPI ID', 'Incomplete Guwahati address', 'Owner unreachable', 'No own delivery staff'];
        openModal(
          '<div style="display:flex; justify-content:space-between; align-items:center;"><h2 class="text-base font-bold">Reject ' + esc(r.name) + '?</h2><button type="button" class="m3-icon-btn" data-action="close-modal">✕</button></div>' +
          '<div style="display:flex; gap:6px; flex-wrap:wrap;">' + reasons.map(function (rs) {
            return '<button type="button" class="m3-chip ' + (state.rejectReason === rs ? 'selected' : '') + '" data-action="pick-reject" data-rest-id="' + esc(r.id) + '" data-reason="' + esc(rs) + '">' + esc(rs) + '</button>';
          }).join('') + '</div>' +
          '<input id="reject-reason-inp" class="m3-input" type="text" placeholder="Custom rejection reason..." value="' + esc(state.rejectReason) + '" />' +
          '<div class="btn-row"><button type="button" class="m3-btn m3-btn-outlined" data-action="close-modal">Keep</button><button type="button" class="m3-btn m3-btn-danger" data-action="confirm-reject-rest" data-rest-id="' + esc(r.id) + '">Confirm Reject</button></div>'
        );
      }

      function openOrderSheet(orderId) {
        var o = state.orders.find(function (x) { return x.id === orderId; });
        if (!o) return;
        var b = getOrderBadge(o.status);
        var isLive = isLiveOrderStatus(o.status);
        openModal(
          '<div style="display:flex; justify-content:space-between; align-items:center;"><div style="display:flex; align-items:center; gap:8px;"><h2 class="text-base font-bold">Order #' + esc(o.id) + '</h2><span class="m3-badge ' + b.cls + '">' + b.label + '</span></div><button type="button" class="m3-icon-btn" data-action="close-modal">✕</button></div>' +
          '<div class="btn-row">' +
          '<a href="' + telHref(o.customerPhone) + '" data-action="call-toast" data-target="' + esc(o.customerName) + '" data-phone="' + esc(o.customerPhone) + '" class="m3-btn m3-btn-tonal m3-btn-sm">' + ICONS.phone + '<span>Call Customer</span></a>' +
          '<a href="' + telHref(o.restaurantPhone) + '" data-action="call-toast" data-target="' + esc(o.restaurantName) + '" data-phone="' + esc(o.restaurantPhone) + '" class="m3-btn m3-btn-tonal m3-btn-sm">' + ICONS.phone + '<span>Call Store</span></a>' +
          '</div>' +
          (o.paymentType === 'upi' ? '<div class="m3-banner-primary text-xs"><strong>Direct UPI · Customer Screenshot Attached</strong><p class="text-xxs" style="margin-top:2px;">Ref: ' + esc(o.upiRef || 'UPI-43291084721') + '</p></div>' : '') +
          (o.staffName ? '<div class="m3-card-tonal" style="display:flex; justify-content:space-between; align-items:center;"><div><p class="text-xxs font-bold text-primary">RIDER</p><p class="text-xs font-bold">' + esc(o.staffName) + ' (' + esc(o.staffPhone) + ')</p></div><a href="' + telHref(o.staffPhone) + '" data-action="call-toast" data-target="' + esc(o.staffName) + '" data-phone="' + esc(o.staffPhone) + '" class="m3-btn m3-btn-filled m3-btn-sm">Call Rider</a></div>' : '') +
          '<div class="m3-card">' + o.items.map(function (it) { return '<div style="display:flex; justify-content:space-between; padding:3px 0;"><span>' + it.qty + ' × ' + esc(it.name) + '</span><strong>' + inr(it.price) + '</strong></div>'; }).join('') +
          '<div style="display:flex; justify-content:space-between; padding-top:6px; margin-top:6px; border-top:1px solid var(--md-outline-variant); font-weight:700;"><span>Total</span><span class="text-primary">' + inr(o.total) + '</span></div></div>' +
          (isLive
            ? '<div class="btn-row"><button type="button" class="m3-btn m3-btn-danger-outline m3-btn-sm" data-action="admin-cancel-order" data-order-id="' + esc(o.id) + '">Cancel Override</button><button type="button" class="m3-btn m3-btn-filled m3-btn-sm" data-action="admin-deliver-order" data-order-id="' + esc(o.id) + '">Mark Delivered</button></div>'
            : '')
        );
      }

      function openTicketSheet(ticketId) {
        var t = state.tickets.find(function (x) { return x.id === ticketId; });
        if (!t) return;
        var isOpen = t.status === 'open';
        openModal(
          '<div style="display:flex; justify-content:space-between; align-items:center;"><div><h2 class="text-base font-bold">Ticket #' + esc(t.id) + '</h2><p class="text-xxs text-muted">' + esc(t.senderName) + ' · ' + esc(t.createdAt) + '</p></div><button type="button" class="m3-icon-btn" data-action="close-modal">✕</button></div>' +
          '<div class="m3-card"><p class="text-sm font-bold">' + esc(t.topic) + '</p><p class="text-xs text-muted" style="margin-top:4px;">' + esc(t.message) + '</p></div>' +
          '<a href="' + telHref(t.senderPhone) + '" data-action="call-toast" data-target="' + esc(t.senderName) + '" data-phone="' + esc(t.senderPhone) + '" class="m3-btn m3-btn-tonal m3-btn-sm m3-btn-block">' + ICONS.phone + '<span>Call ' + esc(t.senderName) + '</span></a>' +
          '<textarea id="ticket-note-inp" class="m3-input" rows="2" placeholder="Resolution note..." style="resize:none;">' + esc(state.ticketDraftNote) + '</textarea>' +
          '<button type="button" data-action="toggle-ticket-status" data-ticket-id="' + esc(t.id) + '" class="m3-btn m3-btn-block ' + (isOpen ? 'm3-btn-filled' : 'm3-btn-outlined') + '">' + (isOpen ? 'Mark Resolved' : 'Reopen Ticket') + '</button>'
        );
      }

      function openNotificationsSheet() {
        var pApp = getPendingRestaurantsCount();
        var pReq = getPendingRequestsCount();
        var oTkt = getOpenTicketsCount();
        openModal(
          '<div style="display:flex; justify-content:space-between; align-items:center;"><div><h2 class="text-base font-bold">Admin Alerts</h2><p class="text-xxs text-muted">Pending items requiring action</p></div><button type="button" class="m3-icon-btn" data-action="close-modal">✕</button></div>' +
          '<button type="button" data-action="jump-stores-notif" data-filter="pending" class="m3-card m3-card-pressable" style="width:100%; text-align:left; display:flex; justify-content:space-between;"><span>Pending Store Approvals</span><span class="m3-badge m3-badge-amber">' + pApp + '</span></button>' +
          '<button type="button" data-action="jump-stores-notif" data-filter="requests" class="m3-card m3-card-pressable" style="width:100%; text-align:left; display:flex; justify-content:space-between;"><span>Detail Change Requests</span><span class="m3-badge m3-badge-primary">' + pReq + '</span></button>' +
          '<button type="button" data-action="jump-support-notif" class="m3-card m3-card-pressable" style="width:100%; text-align:left; display:flex; justify-content:space-between;"><span>Open Support Tickets</span><span class="m3-badge m3-badge-error">' + oTkt + '</span></button>'
        );
      }

      function render() {
        androidShell.classList.toggle('with-nav', state.isAuthenticated);
        appEl.innerHTML = state.isAuthenticated ? renderMainShell() : renderLoginScreen();
        if (notifDotEl) {
          var totalAlerts = getPendingRestaurantsCount() + getPendingRequestsCount() + getOpenTicketsCount();
          notifDotEl.style.display = totalAlerts > 0 ? 'inline-block' : 'none';
        }
        saveState();
      }

      androidShell.addEventListener('click', function (e) {
        if (e.target === modalRoot) { closeModal(); return; }
        var el = e.target.closest('[data-action]');
        if (!el) return;
        var a = el.getAttribute('data-action');

        if (a === 'autofill-admin') { state.loginEmail = 'admin@zayko.in'; state.loginPassword = 'admin123'; state.loginError = ''; render(); showToast('Filled demo admin credentials'); return; }
        if (a === 'toggle-pw') { state.showPassword = !state.showPassword; render(); return; }
        if (a === 'logout') { if (window.ZaykoDB) window.ZaykoDB.signOutUser().catch(function(){}); state.isAuthenticated = false; state.loginPassword = ''; closeModal(); render(); showToast('Logged out'); return; }
        if (a === 'open-notifications') { openNotificationsSheet(); return; }
        if (a === 'jump-stores-notif') { closeModal(); if (state.isAuthenticated) { state.activeTab = 'restaurants'; state.restaurantFilter = el.getAttribute('data-filter') || 'pending'; render(); } return; }
        if (a === 'jump-support-notif') { closeModal(); if (state.isAuthenticated) { state.activeTab = 'support'; state.ticketStatusFilter = 'open'; render(); } return; }
        if (a === 'switch-tab') { state.activeTab = el.getAttribute('data-tab') || 'overview'; render(); window.scrollTo({ top: 0, behavior: 'instant' }); return; }
        if (a === 'jump-stores') { state.activeTab = 'restaurants'; state.restaurantFilter = el.getAttribute('data-filter') || 'pending'; render(); return; }
        if (a === 'jump-support') { state.activeTab = 'support'; state.ticketStatusFilter = 'open'; render(); return; }
        if (a === 'set-rest-filter') { state.restaurantFilter = el.getAttribute('data-filter'); render(); return; }
        if (a === 'set-order-filter') { state.orderFilter = el.getAttribute('data-filter'); render(); return; }
        if (a === 'set-ticket-status') { state.ticketStatusFilter = el.getAttribute('data-filter'); render(); return; }
        if (a === 'set-ticket-source') { state.ticketSourceFilter = el.getAttribute('data-filter'); render(); return; }
        if (a === 'open-verify-sheet') { state.verifyChecks = { details: false, phone: false, upi: false, delivery: false }; openVerifySheet(el.getAttribute('data-rest-id')); return; }
        if (a === 'toggle-verify') { var k = el.getAttribute('data-key'); state.verifyChecks[k] = !state.verifyChecks[k]; openVerifySheet(el.getAttribute('data-rest-id')); return; }
        if (a === 'confirm-approve-rest') {
          var rApp = state.restaurants.find(function (x) { return x.id === el.getAttribute('data-rest-id'); });
          if (rApp) {
            rApp.status = 'live';
            rApp.isOnline = true;
            if (window.ZaykoDB) window.ZaykoDB.setDoc('restaurants', rApp.id, { status: 'live', isOnline: true });
            recordActivity('Live', rApp.name + ' approved to go live.');
            closeModal();
            render();
            showToast(rApp.name + ' is now Live');
          }
          return;
        }
        if (a === 'open-reject-sheet') { state.rejectReason = ''; openRejectSheet(el.getAttribute('data-rest-id')); return; }
        if (a === 'pick-reject') { state.rejectReason = el.getAttribute('data-reason'); openRejectSheet(el.getAttribute('data-rest-id')); return; }
        if (a === 'confirm-reject-rest') {
          var idx = state.restaurants.findIndex(function (x) { return x.id === el.getAttribute('data-rest-id'); });
          if (idx !== -1) {
            var rem = state.restaurants.splice(idx, 1)[0];
            recordActivity('Rejected', 'Rejected ' + rem.name);
            closeModal();
            render();
            showToast('Rejected ' + rem.name);
          }
          return;
        }
        if (a === 'open-pause-sheet') {
          var rP = state.restaurants.find(function (x) { return x.id === el.getAttribute('data-rest-id'); });
          if (!rP) return;
          var isP = rP.status === 'paused';
          openModal('<h2 class="text-base font-bold">' + (isP ? 'Resume ' : 'Pause ') + esc(rP.name) + '?</h2><p class="text-xs text-muted">' + (isP ? 'Restore visibility for customers.' : 'Temporarily hide store from customers.') + '</p><div class="btn-row"><button type="button" class="m3-btn m3-btn-outlined" data-action="close-modal">Cancel</button><button type="button" class="m3-btn ' + (isP ? 'm3-btn-filled' : 'm3-btn-danger') + '" data-action="confirm-toggle-pause" data-rest-id="' + esc(rP.id) + '">' + (isP ? 'Resume' : 'Pause') + '</button></div>');
          return;
        }
        if (a === 'confirm-toggle-pause') {
          var rT = state.restaurants.find(function (x) { return x.id === el.getAttribute('data-rest-id'); });
          if (rT) { rT.status = rT.status === 'paused' ? 'live' : 'paused'; rT.isOnline = rT.status === 'live'; if (window.ZaykoDB) window.ZaykoDB.setDoc('restaurants', rT.id, { status: rT.status, isOnline: rT.isOnline }); closeModal(); render(); showToast(rT.name + ' ' + rT.status); }
          return;
        }
        if (a === 'open-edit-rest-sheet') {
          var rE = state.restaurants.find(function (x) { return x.id === el.getAttribute('data-rest-id'); });
          if (!rE) return;
          openModal(
            '<div style="display:flex; justify-content:space-between; align-items:center;"><h2 class="text-base font-bold">Edit ' + esc(rE.name) + '</h2><button type="button" class="m3-icon-btn" data-action="close-modal">✕</button></div>' +
            '<form id="edit-rest-form" data-rest-id="' + esc(rE.id) + '" novalidate>' +
            '<div class="form-group"><label class="form-label" for="er-name">Name</label><input id="er-name" name="name" class="m3-input" value="' + esc(rE.name) + '" /></div>' +
            '<div class="form-group"><label class="form-label" for="er-addr">Address</label><input id="er-addr" name="address" class="m3-input" value="' + esc(rE.address) + '" /></div>' +
            '<div class="form-group"><label class="form-label" for="er-upi">UPI ID</label><input id="er-upi" name="upiId" class="m3-input" value="' + esc(rE.upiId) + '" /></div>' +
            '<div class="btn-row"><button type="button" class="m3-btn m3-btn-outlined" data-action="close-modal">Cancel</button><button type="submit" class="m3-btn m3-btn-filled">Save</button></div></form>'
          );
          return;
        }
        if (a === 'dismiss-req') {
          var rqD = state.changeRequests.find(function (x) { return x.id === el.getAttribute('data-req-id'); });
          if (rqD) openModal('<h2 class="text-base font-bold">Dismiss change request?</h2><p class="text-xs text-muted">Dismiss ' + esc(rqD.fieldLabel) + ' request for ' + esc(rqD.restaurantName) + '?</p><div class="btn-row"><button type="button" class="m3-btn m3-btn-outlined" data-action="close-modal">Keep</button><button type="button" class="m3-btn m3-btn-danger" data-action="confirm-dismiss-req" data-req-id="' + esc(rqD.id) + '">Dismiss</button></div>');
          return;
        }
        if (a === 'confirm-dismiss-req') {
          var rqDc = state.changeRequests.find(function (x) { return x.id === el.getAttribute('data-req-id'); });
          if (rqDc) { rqDc.status = 'dismissed'; writeSharedRequests(); if (window.ZaykoDB) window.ZaykoDB.setDoc('changeRequests', rqDc.id, { status: 'dismissed' }); closeModal(); render(); showToast('Request dismissed'); }
          return;
        }
        if (a === 'approve-req') {
          var rqA = state.changeRequests.find(function (x) { return x.id === el.getAttribute('data-req-id'); });
          if (rqA) openModal(
            '<h2 class="text-base font-bold">Approve ' + esc(rqA.fieldLabel) + ' update?</h2>' +
            '<div class="m3-card-tonal text-xs"><p class="text-xxs font-bold text-muted">CURRENT</p><p class="text-muted" style="text-decoration:line-through; margin-top:2px;">' + esc(rqA.currentValue) + '</p></div>' +
            '<div class="form-group" style="margin-bottom:4px;"><label class="form-label" for="req-edit-val">Approved New Value (editable)</label><input id="req-edit-val" class="m3-input" type="text" value="' + esc(rqA.requestedValue) + '" /></div>' +
            '<div class="btn-row"><button type="button" class="m3-btn m3-btn-outlined" data-action="close-modal">Cancel</button><button type="button" class="m3-btn m3-btn-filled" data-action="confirm-approve-req" data-req-id="' + esc(rqA.id) + '">Confirm &amp; Approve</button></div>'
          );
          return;
        }
        if (a === 'confirm-approve-req') {
          var rqAc = state.changeRequests.find(function (x) { return x.id === el.getAttribute('data-req-id'); });
          if (rqAc) {
            var editedInp = document.getElementById('req-edit-val');
            var finalVal = editedInp && editedInp.value.trim() ? editedInp.value.trim() : rqAc.requestedValue;
            rqAc.requestedValue = finalVal;
            var tr = state.restaurants.find(function (x) { return x.id === rqAc.restaurantId; });
            if (tr) tr[rqAc.field] = finalVal;
            rqAc.status = 'approved';
            writeSharedRequests();
            if (window.ZaykoDB) { window.ZaykoDB.setDoc('changeRequests', rqAc.id, { status: 'approved', requestedValue: finalVal }); if (tr) window.ZaykoDB.setDoc('restaurants', tr.id, { [rqAc.field]: finalVal }); }
            recordActivity('Updated', 'Approved ' + rqAc.fieldLabel + ' for ' + rqAc.restaurantName);
            closeModal();
            render();
            showToast('Approved update for ' + rqAc.restaurantName);
          }
          return;
        }
        if (a === 'open-order-sheet') { openOrderSheet(el.getAttribute('data-order-id')); return; }
        if (a === 'admin-deliver-order') {
          var oD = state.orders.find(function (x) { return x.id === el.getAttribute('data-order-id'); });
          if (oD) openModal('<h2 class="text-base font-bold">Confirm Mark Delivered?</h2><p class="text-xs text-muted">Mark Order #' + esc(oD.id) + ' (' + esc(oD.restaurantName) + ') as Delivered?</p><div class="btn-row"><button type="button" class="m3-btn m3-btn-outlined" data-action="open-order-sheet" data-order-id="' + esc(oD.id) + '">Back</button><button type="button" class="m3-btn m3-btn-filled" data-action="confirm-admin-deliver" data-order-id="' + esc(oD.id) + '">Confirm</button></div>');
          return;
        }
        if (a === 'confirm-admin-deliver') {
          var oDc = state.orders.find(function (x) { return x.id === el.getAttribute('data-order-id'); });
          if (oDc) { oDc.status = 'delivered'; if (window.ZaykoDB) window.ZaykoDB.setDoc('orders', oDc.id, { status: 'delivered' }); recordActivity('Delivered', 'Order #' + oDc.id + ' marked delivered.'); closeModal(); render(); showToast('Order #' + oDc.id + ' delivered'); }
          return;
        }
        if (a === 'admin-cancel-order') {
          var oC = state.orders.find(function (x) { return x.id === el.getAttribute('data-order-id'); });
          if (oC) openModal('<h2 class="text-base font-bold">Confirm Cancel Override?</h2><p class="text-xs text-muted">Cancel Order #' + esc(oC.id) + ' (' + esc(oC.customerName) + ')?</p><div class="btn-row"><button type="button" class="m3-btn m3-btn-outlined" data-action="open-order-sheet" data-order-id="' + esc(oC.id) + '">Keep</button><button type="button" class="m3-btn m3-btn-danger" data-action="confirm-admin-cancel" data-order-id="' + esc(oC.id) + '">Confirm Cancel</button></div>');
          return;
        }
        if (a === 'confirm-admin-cancel') {
          var oCc = state.orders.find(function (x) { return x.id === el.getAttribute('data-order-id'); });
          if (oCc) { oCc.status = 'cancelled'; oCc.cancelReason = 'Cancelled via Admin Override'; if (window.ZaykoDB) window.ZaykoDB.setDoc('orders', oCc.id, { status: 'cancelled', cancelReason: oCc.cancelReason }); recordActivity('Cancelled', 'Order #' + oCc.id + ' cancelled by Admin.'); closeModal(); render(); showToast('Order #' + oCc.id + ' cancelled'); }
          return;
        }
        if (a === 'open-ticket-sheet') {
          var tk = state.tickets.find(function (x) { return x.id === el.getAttribute('data-ticket-id'); });
          state.ticketDraftNote = tk ? tk.resolutionNote || '' : '';
          openTicketSheet(el.getAttribute('data-ticket-id'));
          return;
        }
        if (a === 'toggle-ticket-status') {
          var tkU = state.tickets.find(function (x) { return x.id === el.getAttribute('data-ticket-id'); });
          if (tkU) {
            var nextSt = tkU.status === 'open' ? 'Resolved' : 'Open';
            openModal('<h2 class="text-base font-bold">Confirm Ticket Update?</h2><p class="text-xs text-muted">Mark Ticket #' + esc(tkU.id) + ' as ' + nextSt + '?</p><div class="btn-row"><button type="button" class="m3-btn m3-btn-outlined" data-action="open-ticket-sheet" data-ticket-id="' + esc(tkU.id) + '">Back</button><button type="button" class="m3-btn m3-btn-filled" data-action="confirm-toggle-ticket" data-ticket-id="' + esc(tkU.id) + '">Confirm</button></div>');
          }
          return;
        }
        if (a === 'confirm-toggle-ticket') {
          var tkUc = state.tickets.find(function (x) { return x.id === el.getAttribute('data-ticket-id'); });
          if (tkUc) {
            tkUc.resolutionNote = state.ticketDraftNote.trim();
            tkUc.status = tkUc.status === 'open' ? 'resolved' : 'open'; if (window.ZaykoDB) window.ZaykoDB.setDoc('tickets', tkUc.id, { status: tkUc.status, resolutionNote: tkUc.resolutionNote });
            closeModal();
            render();
            showToast('Ticket #' + tkUc.id + ' ' + tkUc.status);
          }
          return;
        }
        if (a === 'call-toast') { showToast('Calling ' + (el.getAttribute('data-target') || 'contact') + '...'); return; }
        if (a === 'confirm-save-edit-rest') {
          var p = state.pendingSaveAction;
          if (p) {
            var rEdit = state.restaurants.find(function (x) { return x.id === p.id; });
            if (rEdit) {
              rEdit.name = p.name;
              rEdit.address = p.address;
              rEdit.upiId = p.upiId;
              if (window.ZaykoDB) window.ZaykoDB.setDoc('restaurants', rEdit.id, { name: rEdit.name, address: rEdit.address, upiId: rEdit.upiId }); recordActivity('Admin Edit', 'Updated profile details for ' + rEdit.name + '.');
              showToast('Saved details for ' + rEdit.name);
            }
            state.pendingSaveAction = null;
          }
          closeModal();
          render();
          return;
        }
        if (a === 'close-modal') { state.pendingSaveAction = null; closeModal(); }
      });

      androidShell.addEventListener('input', function (e) {
        var t = e.target;
        if (!t || !t.id) return;
        if (t.id === 'admin-email') state.loginEmail = t.value;
        else if (t.id === 'admin-password') state.loginPassword = t.value;
        else if (t.id === 'rest-search-input') {
          var p = t.selectionStart; state.restaurantSearch = t.value; render();
          var r = document.getElementById('rest-search-input'); if (r) { r.focus(); r.setSelectionRange(p, p); }
        } else if (t.id === 'order-search-input') {
          var p2 = t.selectionStart; state.orderSearch = t.value; render();
          var r2 = document.getElementById('order-search-input'); if (r2) { r2.focus(); r2.setSelectionRange(p2, p2); }
        } else if (t.id === 'reject-reason-inp') state.rejectReason = t.value;
        else if (t.id === 'ticket-note-inp') state.ticketDraftNote = t.value;
      });

      androidShell.addEventListener('submit', function (e) {
        var f = e.target;
        if (!f || !f.id) return;
        e.preventDefault();
        if (f.id === 'admin-login-form') {
          var em = state.loginEmail.trim().toLowerCase();
          var pw = state.loginPassword;
          if (!em || !pw) {
            state.loginError = 'Enter your Firebase Admin email and password.';
            render();
            return;
          }
          if (!window.ZaykoDB) {
            state.loginError = 'Firebase is still loading. Please try again.';
            render();
            return;
          }
          window.ZaykoDB.signInAdmin(em, pw)
            .then(function () {
              state.loginError = '';
              state.isAuthenticated = true;
              state.activeTab = 'overview';
              render();
              showToast('Signed in to Zayko Admin');
            })
            .catch(function (err) {
              state.loginError = (err && err.message) ? err.message : 'Invalid admin email or password.';
              render();
            });
        } else if (f.id === 'edit-rest-form') {
          var fd = new FormData(f);
          var rest = state.restaurants.find(function (x) { return x.id === f.getAttribute('data-rest-id'); });
          if (rest) {
            var nName = String(fd.get('name') || rest.name).trim();
            var nAddr = String(fd.get('address') || rest.address).trim();
            var nUpi = String(fd.get('upiId') || rest.upiId).trim();
            if (!nName || !nAddr || !nUpi) {
              showToast('All restaurant fields are required');
              return;
            }
            var diffs = [];
            if (rest.name !== nName) diffs.push({ l: 'Name', f: rest.name, t: nName });
            if (rest.address !== nAddr) diffs.push({ l: 'Address', f: rest.address, t: nAddr });
            if (rest.upiId !== nUpi) diffs.push({ l: 'UPI ID', f: rest.upiId, t: nUpi });
            state.pendingSaveAction = { id: rest.id, name: nName, address: nAddr, upiId: nUpi };
            openModal(
              '<div style="display:flex; justify-content:space-between; align-items:center;"><h2 class="text-base font-bold">Confirm Save Changes?</h2><button type="button" class="m3-icon-btn" data-action="close-modal">✕</button></div>' +
              '<p class="text-xs text-muted">Review updated details for <strong>' + esc(nName) + '</strong> before saving.</p>' +
              (diffs.length > 0
                ? diffs.map(function (d) {
                    return '<div class="m3-card-tonal text-xs"><p class="text-xxs font-bold text-muted" style="text-transform:uppercase;">' + esc(d.l) + '</p><p class="text-muted" style="text-decoration:line-through; margin-top:2px;">' + esc(d.f) + '</p><p class="font-bold text-primary">→ ' + esc(d.t) + '</p></div>';
                  }).join('')
                : '<div class="m3-card-tonal text-xs text-muted">No fields changed. Confirm to save anyway.</div>') +
              '<div class="btn-row"><button type="button" class="m3-btn m3-btn-outlined" data-action="open-edit-rest-sheet" data-rest-id="' + esc(rest.id) + '">Go Back</button><button type="button" class="m3-btn m3-btn-filled" data-action="confirm-save-edit-rest">Confirm &amp; Save</button></div>'
            );
          }
        } else if (f.id === 'global-settings-form') {
          var sfd = new FormData(f);
          state.settings.deliveryFee = Math.round(Number(sfd.get('fee') || 50));
          state.settings.baseDistanceKm = Number(sfd.get('base') || 5);
          state.settings.extraPerKmFee = Math.round(Number(sfd.get('extra') || 10));
          state.settings.maxRadiusKm = Number(sfd.get('radius') || 7);
          state.settings.supportPhone = String(sfd.get('phone') || '+91 98640 00111').trim();
          if (window.ZaykoDB) window.ZaykoDB.setDoc('settings', 'global', state.settings); recordActivity('Settings', 'Updated global delivery & support configuration.');
          render();
          showToast('Global settings saved');
        }
      });

      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });

      // =========================================================================
      // FIREBASE REAL-TIME SYNC (ADMIN CONSOLE)
      // =========================================================================
      function initAdminFirestore() {
        if (!window.ZaykoDB) return;
        var db = window.ZaykoDB;

        db.onAuth(function (user) {
          if (user && !user.isAnonymous && !state.isAuthenticated) {
            state.isAuthenticated = true;
            render();
          }
        });

        db.listenCollection('restaurants', function (list) {
          if (list && list.length > 0) {
            state.restaurants = list;
            render();
          }
        });

        db.listenCollection('changeRequests', function (list) {
          if (list && list.length > 0) {
            state.changeRequests = list;
            render();
          }
        });

        db.listenCollection('orders', function (list) {
          if (list && list.length > 0) {
            list.sort(function (a, b) { return Number(b.id) - Number(a.id); });
            state.orders = list.map(function (o) {
              return {
                ...o,
                id: String(o.id || o._docId),
                paymentType: (o.paymentType === 'upi' || o.paymentMethod === 'UPI') ? 'upi' : 'cod',
                items: Array.isArray(o.items) ? o.items : (o.itemsList || [])
              };
            });
            render();
          }
        });

        db.listenCollection('tickets', function (list) {
          if (list && list.length > 0) {
            state.tickets = list;
            render();
          }
        });

        db.listenDoc('settings', 'global', function (s) {
          if (s) {
            state.settings = Object.assign({}, state.settings, s);
            render();
          }
        });
      }

      if (window.ZaykoDB) initAdminFirestore();
      else window.addEventListener('zayko-db-ready', initAdminFirestore);

      render();
    })();
  </script>
</body>
</html>
