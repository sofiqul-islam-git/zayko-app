name: Build Zayko Test APKs

on:
  workflow_dispatch:

jobs:
  build-apks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Customer Debug APK
        run: |
          mkdir -p build-customer && cd build-customer
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Zayko" "in.zayko.customer" --web-dir ../www-customer
          npx cap add android
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Build Partner Debug APK
        run: |
          mkdir -p build-partner && cd build-partner
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Zayko Partner" "in.zayko.partner" --web-dir ../www-partner
          npx cap add android
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload Customer APK
        uses: actions/upload-artifact@v4
        with:
          name: zayko-customer-debug-apk
          path: build-customer/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Partner APK
        uses: actions/upload-artifact@v4
        with:
          name: zayko-partner-debug-apk
          path: build-partner/android/app/build/outputs/apk/debug/app-debug.apk
          
